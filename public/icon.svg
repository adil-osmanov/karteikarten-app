<svg viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Премиальный глубокий фон macOS -->
    <linearGradient id="appleDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1F24" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <!-- Фирменный синий градиент Apple -->
    <linearGradient id="appleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0066D6" />
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Сквиркл иконки -->
  <rect width="512" height="512" rx="115" fill="url(#appleDark)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="2" />

  <!-- Главная карточка по центру -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="#242428" stroke="white" stroke-opacity="0.12" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Крупная монументальная литера "K" -->
  <path d="M 175 160 L 210 160 L 210 352 L 175 352 Z" fill="#FFFFFF" />
  <path d="M 210 262 L 295 160 L 338 160 L 244 266 L 342 352 L 298 352 Z" fill="#FFFFFF" />

  <!-- Акцентная полоса Cloze (подчеркивание слова) -->
  <rect x="175" y="375" width="162" height="14" rx="7" fill="url(#appleBlue)" />
</svg>